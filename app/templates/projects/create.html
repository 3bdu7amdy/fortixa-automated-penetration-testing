{% extends "base.html" %}
{% block title %}New Project - Pentest AI Platform{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Create New Project</h1>
        <p class="page-subtitle">Set up a new security engagement</p>
    </div>
    <a href="{{ url_for('projects.list_projects') }}" class="btn btn-secondary">Back to Projects</a>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST" action="{{ url_for('projects.create_project') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label" for="name">Project Name</label>
            <input type="text" id="name" name="name" class="form-input"
                   placeholder="e.g., Acme Corp Pentest Q2" required minlength="3" autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-textarea"
                      placeholder="Describe the scope and objectives of this engagement" rows="4"></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem;">
            <button type="submit" class="btn btn-primary">Create Project</button>
            <a href="{{ url_for('projects.list_projects') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
