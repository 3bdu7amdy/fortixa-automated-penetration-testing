{% extends "base.html" %}
{% block title %}Edit {{ project.name }} - Pentest AI Platform{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Edit Project</h1>
        <p class="page-subtitle">{{ project.name }}</p>
    </div>
    <a href="{{ url_for('projects.view_project', project_id=project.id) }}" class="btn btn-secondary">Back to Project</a>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST" action="{{ url_for('projects.edit_project', project_id=project.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label" for="name">Project Name</label>
            <input type="text" id="name" name="name" class="form-input"
                   value="{{ project.name }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-textarea" rows="4">{{ project.description or '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="status">Status</label>
            <select id="status" name="status" class="form-select">
                <option value="active" {{ 'selected' if project.status == 'active' }}>Active</option>
                <option value="completed" {{ 'selected' if project.status == 'completed' }}>Completed</option>
                <option value="archived" {{ 'selected' if project.status == 'archived' }}>Archived</option>
            </select>
        </div>

        <div style="display: flex; gap: 0.75rem;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('projects.view_project', project_id=project.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
