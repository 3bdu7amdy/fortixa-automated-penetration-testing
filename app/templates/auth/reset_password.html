{% extends "base.html" %}
{% block title %}Reset Password - Pentest AI Platform{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email to receive a reset link</p>

        <form method="POST" action="{{ url_for('auth.reset_password_request') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input"
                       placeholder="Enter your email address" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
