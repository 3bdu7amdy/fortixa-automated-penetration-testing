{% extends "base.html" %}
{% block title %}401 - Unauthorized{% endblock %}
{% block content %}
<div class="error-container">
    <div class="error-code">401</div>
    <div class="error-message">You must be logged in to access this page.</div>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Sign In</a>
</div>
{% endblock %}
