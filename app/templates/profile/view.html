{% extends "base.html" %}
{% block title %}Profile - Pentest AI Platform{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Profile</h1>
        <p class="page-subtitle">Manage your account settings</p>
    </div>
</div>

<!-- Profile Info Card -->
<div class="card" style="max-width: 600px; margin-bottom: 1.5rem;">
    <div class="card-header">
        <h2 class="card-title">Account Information</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('profile.update_profile') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input"
                       value="{{ profile_user.username }}" required minlength="3">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input"
                       value="{{ profile_user.email }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Role</label>
                <input type="text" class="form-input" value="{{ profile_user.role }}" disabled
                       style="opacity: 0.6;">
            </div>
            <div class="form-group">
                <label class="form-label">Member Since</label>
                <input type="text" class="form-input" value="{{ profile_user.created_at.strftime('%B %d, %Y') }}" disabled
                       style="opacity: 0.6;">
            </div>
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>
</div>

<!-- Change Password Card -->
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h2 class="card-title">Change Password</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('profile.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="old_password">Current Password</label>
                <input type="password" id="old_password" name="old_password" class="form-input"
                       required placeholder="Enter your current password">
            </div>
            <div class="form-group">
                <label class="form-label" for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-input"
                       required minlength="8" placeholder="At least 8 characters">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                       required minlength="8" placeholder="Repeat new password">
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
